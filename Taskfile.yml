# Tasks for outbox. Task is pinned in go.mod, so `go tool task <name>`
# works with nothing but Go installed. `go tool task --list` shows them all.
version: "3"

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  LDFLAGS: -s -w -X main.version={{.VERSION}}

tasks:
  default:
    cmds:
      - task --list
    silent: true

  build:
    desc: Build bin/outbox
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o bin/outbox ./cmd/outbox

  fmt:
    desc: Format the Go
    cmds:
      - gofmt -w cmd internal

  test:
    desc: Run the tests
    cmds:
      - go test ./...

  check:
    desc: "What CI runs: formatting, vet, tests"
    cmds:
      - cmd: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then echo "$unformatted"; echo "run: task fmt"; exit 1; fi
      - go vet ./...
      - go test -count=1 ./...

  dist:
    desc: "Release files into dist/: outbox for macOS, Linux and Windows (amd64, arm64), checksums.txt"
    cmds:
      - rm -rf dist && mkdir -p dist
      - |
        for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
          os=${target%/*}
          arch=${target#*/}
          dir=$(mktemp -d)
          CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "{{.LDFLAGS}}" -o "$dir/outbox" ./cmd/outbox
          cp LICENSE README.md "$dir/"
          tar -czf "dist/outbox_${os}_${arch}.tar.gz" -C "$dir" outbox LICENSE README.md
          rm -rf "$dir"
        done
      - |
        for arch in amd64 arm64; do
          dir=$(mktemp -d)
          CGO_ENABLED=0 GOOS=windows GOARCH=$arch go build -trimpath -ldflags "{{.LDFLAGS}}" -o "$dir/outbox.exe" ./cmd/outbox
          cp LICENSE README.md "$dir/"
          zip -q -j "dist/outbox_windows_${arch}.zip" "$dir/outbox.exe" "$dir/LICENSE" "$dir/README.md"
          rm -rf "$dir"
        done
      - cd dist && if command -v sha256sum >/dev/null; then sha256sum *; else shasum -a 256 *; fi | grep -v checksums.txt > checksums.txt

  image:
    desc: "Build the image for this machine, as outbox:local (CI publishes ghcr.io/stagdhq/outbox)"
    cmds:
      - docker buildx build --load --build-arg VERSION={{.VERSION}} -t outbox:local .
